name: Build signed IPA

# Secrets (Settings -> Secrets and variables -> Actions):
#   CERT_P12_BASE64      base64 of your .p12 certificate
#   CERT_PASSWORD        password of the .p12
#   PROFILE_BASE64       base64 of your .mobileprovision
#   TEAM_ID              Apple Developer Team ID
#   BUNDLE_ID            bundle id that matches the provisioning profile
#   EXPORT_METHOD        development | ad-hoc | enterprise  (optional, default development)
#   SIGN_IDENTITY        e.g. "Apple Development" / "Apple Distribution" (optional)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    env:
      CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
      CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      EXPORT_METHOD: ${{ secrets.EXPORT_METHOD || 'development' }}
      SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY || 'Apple Development' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen & generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Import certificate and profile
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "tmp" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "tmp" "$KC"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "tmp" "$KC"
          security list-keychains -d user -s "$KC" login.keychain

          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/p.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/p.mobileprovision" > "$RUNNER_TEMP/p.plist"
          UUID=$(plutil -extract UUID raw "$RUNNER_TEMP/p.plist")
          PROFILE_NAME=$(plutil -extract Name raw "$RUNNER_TEMP/p.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/p.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          xcodebuild archive \
            -project SimpClient.xcodeproj \
            -scheme SimpClient \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SimpClient.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY"

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SimpClient.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist"
          cp "$RUNNER_TEMP"/export/*.ipa SimpClient-signed.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SimpClient-signed-ipa
          path: SimpClient-signed.ipa
